title = "Dunbit"
baseURL = "https://dunbit.com/"
theme = "dunbit"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
# French was template placeholder content only — disabled until real translations exist
disableLanguages = ["fr"]

[params]
  googleAnalitycsID = "UA-145017939-1"
  description = "Dunbit is a software consultancy in Ljubljana, Slovenia. We architect, build and assess web, mobile and cloud systems."
  author = "Dunbit"
  email = "info@dunbit.com"
  phone = "+386 41 336 457"
  city = "Ljubljana"
  country = "Slovenia"
  linkedin = "https://www.linkedin.com/company/dunbit"
  # Formspree form ID (e.g. "xyzabcd"). When empty, the contact form falls back to opening the visitor's email app.
  formspree = ""

[Languages]
  [Languages.en]
    languageName = "En"
    weight = 1
    languageCode = "en-us"
    title = "Dunbit"

    [[Languages.en.menu.header]]
      weight = 1
      name = "Services"
      url = "service"
    [[Languages.en.menu.header]]
      weight = 2
      name = "Approach"
      url = "approach"

    [[Languages.en.menu.footer]]
      weight = 1
      name = "Services"
      url = "service"
    [[Languages.en.menu.footer]]
      weight = 2
      name = "Contact"
      url = "contact"
    [[Languages.en.menu.footer]]
      weight = 3
      name = "Terms"
      url = "terms"

  [Languages.fr]
    languageName = "Fr"
    weight = 2
    languageCode = "fr-fr"
